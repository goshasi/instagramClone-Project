<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>instagramClone-Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!--HEADER-->
      <header class="flex">
        <div class="profile">
          <img src="assets/imgs/profile.png" alt="" />
        </div>
        <div class="info">
          <nav class="webNavbar flex">
            <h2>go.shasi</h2>
            <img src="assets/icons/Ellipsis-Vertical.svg" alt="" srcset="" />
          </nav>
          <span class="userName">shasi🥷🏻</span>
          <div class="DataBar">
            <ul class="datalist flex">
              <li class="postElement">
                <a href="http://" target="_blank" rel="noopener noreferrer"
                  ><span class="postSpan">0</span> Posts</a
                >
              </li>
              <li class="followersElement">
                <a href="http://" target="_blank" rel="noopener noreferrer"
                  ><span class="followersSpan">111</span> followers</a
                >
              </li>
              <li class="followingElement">
                <a href="http://" target="_blank" rel="noopener noreferrer"
                  ><span class="followingSpan">1,115</span> following</a
                >
              </li>
            </ul>
          </div>
          <div class="discription">
            <p class="accCategory">Digital creator</p>
            <p class="birthday">2003🐹🥢</p>
            <p class="career">front-end 🔜 full-stack 🥷🏻🎯</p>
            <p class="inspiration">自分を誇りに思う!</p>
          </div>
        </div>
      </header>
      <!--SCROLL BAR-->
      <div class="scrollBar">
        <ul class="Highlights">
          <li class="dv study">
            <img src="assets/imgs/study.png" alt="" />
            <h6>study</h6>
          </li>
          <li class="dv hart">
            <img src="assets/imgs/hart.png" alt="" />
            <h6><code>&lt;</code>3</h6>
          </li>
          <li class="dv randoms">
            <img src="assets/imgs/randoms.png" alt="" />
            <h6>randoms</h6>
          </li>
          <li class="dv azkar">
            <img src="assets/imgs/azkar.png" alt="" />
            <h6>azkar</h6>
          </li>
          <li class="dv me">
            <img src="assets/imgs/me.png" alt="" />
            <h6>me</h6>
          </li>
          <li class="dv sketchs">
            <img src="assets/imgs/sketchs.png" alt="" />
            <h6>sketchs</h6>
          </li>
        </ul>
      </div>
      <!--TAB PANEL-->
      <div class="tabPanel">
        <ul class="iconPanel flex">
          <li class="userSv">
            <a href="http://" target="_blank" rel="noopener noreferrer">
              <img src="assets/icons/user.svg" alt="" srcset="" />
            </a>
          </li>
          <li class="RepostSvg">
            <a href="http://" target="_blank" rel="noopener noreferrer">
              <img src="assets/icons/Repost.svg" alt="" srcset="" />
            </a>
          </li>
          <li class="Square-PlaySvg">
            <a href="http://" target="_blank" rel="noopener noreferrer">
              <img src="assets/icons/Square-Play.svg" alt="" srcset="" />
            </a>
          </li>
          <li class="GripSvg">
            <a href="http://" target="_blank" rel="noopener noreferrer">
              <img src="assets/icons/Grip.svg" alt="" srcset="" />
            </a>
          </li>
        </ul>
        <hr style="height: 2px; color: grey" />
      </div>
      <!--POST SECTİON-->
      <div class="postSection">
        <div class="noPostsYet">
          <img src="assets/icons/Camera.svg" alt="" srcset="" />
        </div>
      </div>
    </div>
  </body>
</html>
